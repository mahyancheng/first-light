services:
  game:
    image: ghcr.io/mahyancheng/first-light:${RELEASE_SHA:?Set an immutable GitHub commit}
    container_name: first-light
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${TAILNET_IP:?Set the host tailnet address}:8111:3111"
    environment:
      DATA_PATH: /data/game.sqlite
      CODEX_HOME: /home/node/.codex
    volumes:
      - first-light-data:/data
      - first-light-codex:/home/node/.codex
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3111/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  first-light-data:
    name: first-light-data
  first-light-codex:
    name: first-light-codex
